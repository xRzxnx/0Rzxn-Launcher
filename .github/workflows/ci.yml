name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Translations
        run: npm run check:i18n

      - name: Build installer (not published)
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  # Les tests tournent aussi sous Linux et macOS (phase 9) ; types, lint et traductions ne dépendent pas du système.
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

  # Version Rust (plan R) : format, clippy, interface en WebAssembly et tests, sur les 3 systèmes.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      # L'app embarque crates/interface/dist (construit par trunk) : une page vide suffit pour compiler et tester.
      - name: Placeholder interface
        shell: bash
        run: mkdir -p crates/interface/dist && echo '<!doctype html>' > crates/interface/dist/index.html

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude interface --all-targets -- -D warnings

      - name: Interface (WebAssembly)
        run: cargo clippy -p interface --target wasm32-unknown-unknown -- -D warnings

      - name: Tests
        run: cargo test
