name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Translations
        run: npm run check:i18n

      - name: Build installer (not published)
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
