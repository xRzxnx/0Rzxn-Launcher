name: Release

# Builds the Windows installer, the Linux AppImage and the macOS dmgs from main, and publishes the GitHub release
# that installed launchers read.
# Started by `npm run publier` (workflow_dispatch on main). Pull requests that touch the release pipeline
# run it as a dry run: everything except signing, VirusTotal and the release itself.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build only, publish nothing
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/metadonnees-maj.js
      - scripts/virustotal.js
      - build/signpath/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Linux (AppImage) and macOS (dmg for Apple Silicon and Intel, plus the zips that only carry latest-mac.yml:
  # unsigned macOS apps can't update themselves, the launcher only sees the new version and opens its page).
  # Nothing here is signed by SignPath; macOS apps get the free ad-hoc signature (package.json mac.identity "-").
  unix:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            build: --linux AppImage
          - os: macos-latest
            build: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npx electron-builder ${{ matrix.build }} --publish never

      - name: Keep the files
        uses: actions/upload-artifact@v7
        with:
          name: unix-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*-linux.yml
            dist/*-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    needs: unix
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the tag and the release (only this job)
      actions: read # SignPath reads the uploaded artifacts
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry-run }}
      # Signing starts once the SignPath secret exists; until then the release is unsigned, as before.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.event_name != 'pull_request' && !inputs.dry-run }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Only main is released
        if: env.DRY_RUN != 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "Releases are built from main only (got ${{ github.ref }})."
          exit 1

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then echo "Version $version must look like 1.2.3 or 1.2.3-beta.4."; exit 1; fi
          if [ "$DRY_RUN" != "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "Tag v$version already exists."; exit 1; fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
            echo "installer=0Rzxn_-Launcher-Setup-$version.exe"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: |
          npm test
          npm run check:types
          npm run lint
          npm run check:i18n

      # A full build (not --dir): only an installer target writes resources/app-update.yml into win-unpacked,
      # and installed launchers need that file to find their updates.
      - name: Build
        run: npx electron-builder --win nsis --publish never

      # ---- Signing the app executable (SignPath Foundation) ----
      - name: Upload the unsigned app
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned
          path: dist/win-unpacked
          if-no-files-found: error
          retention-days: 1

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: programme
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/win-unpacked-signed

      - name: Use the signed app
        if: env.SIGN == 'true'
        run: |
          rm -rf dist/win-unpacked
          mv dist/win-unpacked-signed dist/win-unpacked

      - name: Rebuild the installer around the signed app
        if: env.SIGN == 'true'
        # The first (unsigned) installer is removed first: an antivirus scan can keep it locked and make NSIS fail.
        run: |
          rm -f "dist/${{ steps.version.outputs.installer }}" "dist/${{ steps.version.outputs.installer }}.blockmap"
          npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never

      # ---- Signing the installer ----
      - name: Upload the unsigned installer
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.version.outputs.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installateur
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: mv -f "dist/signed/${{ steps.version.outputs.installer }}" "dist/${{ steps.version.outputs.installer }}"

      # Signing changes the installer bytes: latest.yml and the blockmap must describe the final file.
      - name: Update metadata
        run: node scripts/metadonnees-maj.js "dist/${{ steps.version.outputs.installer }}"

      - name: Keep the installer (7 days)
        uses: actions/upload-artifact@v7
        with:
          name: release-installer
          path: |
            dist/${{ steps.version.outputs.installer }}
            dist/${{ steps.version.outputs.installer }}.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Linux and macOS files
        uses: actions/download-artifact@v7
        with:
          pattern: unix-*
          path: dist/unix
          merge-multiple: true

      - name: Check the Linux and macOS files
        run: |
          ls -l dist/unix
          v="${{ steps.version.outputs.version }}"
          for f in "0Rzxn_-Launcher-$v.AppImage" "0Rzxn_-Launcher-$v-arm64.dmg" "0Rzxn_-Launcher-$v-x64.dmg"; do
            [ -f "dist/unix/$f" ] || { echo "Missing dist/unix/$f"; exit 1; }
          done

      # One analysis per downloadable file (the macOS zips hold the same app as the dmgs). Exit code: 2 if any file
      # is blocked, otherwise 1 if any analysis failed, 0 if all are clean.
      - name: VirusTotal
        id: virustotal
        if: env.DRY_RUN != 'true'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set +e
          v="${{ steps.version.outputs.version }}"
          worst=0
          scan() {
            node scripts/virustotal.js "$2" --json "vt-$1.json"
            c=$?
            if [ "$c" = "2" ] || { [ "$c" != "0" ] && [ "$worst" = "0" ]; }; then worst=$c; fi
          }
          scan windows "dist/${{ steps.version.outputs.installer }}"
          scan linux "dist/unix/0Rzxn_-Launcher-$v.AppImage"
          scan mac-arm64 "dist/unix/0Rzxn_-Launcher-$v-arm64.dmg"
          scan mac-x64 "dist/unix/0Rzxn_-Launcher-$v-x64.dmg"
          echo "code=$worst" >> "$GITHUB_OUTPUT"

      - name: Release
        if: env.DRY_RUN != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          installer="dist/${{ steps.version.outputs.installer }}"
          notes_file="docs/release-notes-$version.md"
          if [ -f "$notes_file" ]; then cp "$notes_file" notes.md
          else
            previous=$(git describe --tags --abbrev=0 2>/dev/null)
            git log ${previous:+$previous..}HEAD --no-merges --format='- %s' > notes.md
          fi
          code="${{ steps.virustotal.outputs.code }}"
          printf '\n---\n\n' >> notes.md
          for part in "windows:Windows" "linux:Linux" "mac-arm64:macOS Apple Silicon" "mac-x64:macOS Intel"; do
            line=$(node -e "try { const r = require('./vt-${part%%:*}.json'); console.log(r.notes ?? '') } catch { }")
            if [ -n "$line" ]; then printf '%s\n\n' "${line/\*\*VirusTotal\*\*/**VirusTotal ${part#*:}**}" >> notes.md; fi
          done
          printf '[Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md)\n' >> notes.md
          kind=--latest
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && kind=--prerelease
          gh release create "$tag" "$installer" "$installer.blockmap" dist/latest.yml dist/unix/* \
            --draft --title "$tag" --notes-file notes.md --target "$GITHUB_SHA" $kind
          if [ "$code" = "2" ]; then
            echo "::error::VirusTotal: too many detections. The release $tag stays a draft; check the report before publishing it by hand."
            exit 1
          fi
          [ "$code" = "0" ] || echo "::warning::VirusTotal analysis unavailable (exit $code); the release is published without it."
          gh release edit "$tag" --draft=false $kind
          echo "Published $tag: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
